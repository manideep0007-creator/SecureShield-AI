name: Android CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/**, fix/** ]
    tags:
      - 'v*'
    paths:
      - 'android/**'
      - '.github/workflows/android-ci-cd.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci-cd.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build, Test & Distribute APK
    runs-on: ubuntu-latest
    env:
      PROD_BASE_URL: ${{ secrets.PROD_BASE_URL || 'https://secureshield-ai-yzn2.onrender.com/' }}
      DEV_BASE_URL: ${{ secrets.DEV_BASE_URL || 'https://secureshield-ai-yzn2.onrender.com/' }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_SERVICE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: secureshield-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Direct Mobile Download (GitHub Release)
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('SecureShield AI {0}', github.ref_name) || 'SecureShield AI (Latest APK)' }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Distribute to Firebase App Distribution
        if: env.FIREBASE_APP_ID != '' && (env.FIREBASE_TOKEN != '' || env.FIREBASE_SERVICE_CREDENTIALS != '')
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}
          groups: ${{ secrets.FIREBASE_TESTER_GROUPS || 'internal-testers' }}
          file: android/app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: "Automated test build from GitHub Actions commit ${{ github.sha }}"

      - name: Log Firebase Status
        if: env.FIREBASE_APP_ID == ''
        run: |
          echo "ℹ️ Firebase App Distribution secrets not configured. APK successfully generated and stored in GitHub Actions artifacts."


