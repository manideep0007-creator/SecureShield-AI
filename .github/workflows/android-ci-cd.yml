name: Android CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci-cd.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build, Test & Distribute APK
    runs-on: ubuntu-latest
    env:
      PROD_BASE_URL: ${{ secrets.PROD_BASE_URL || 'https://secureshield-ai-yzn2.onrender.com/' }}
      DEV_BASE_URL: ${{ secrets.DEV_BASE_URL || 'https://secureshield-ai-yzn2.onrender.com/' }}
      SECURESHIELD_API_KEY: ${{ secrets.SECURESHIELD_API_KEY || secrets.API_KEY || '' }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_SERVICE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Check Release Signing Configuration
        id: check_signing
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.RELEASE_STORE_PASSWORD }}" ] && [ -n "${{ secrets.RELEASE_KEY_ALIAS }}" ] && [ -n "${{ secrets.RELEASE_KEY_PASSWORD }}" ]; then
            echo "has_signing=true" >> $GITHUB_OUTPUT
            echo "Release signing credentials detected."
          else
            echo "has_signing=false" >> $GITHUB_OUTPUT
            echo "::notice::No release signing credentials found in secrets. Debug APK will be published for distribution."
          fi

      - name: Decode Release Keystore (if configured in Secrets)
        if: steps.check_signing.outputs.has_signing == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: Run Unit Tests & Build Debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.check_signing.outputs.has_signing == 'true' && 'release.keystore' || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: secureshield-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Production Release APK (when signing credentials present)
        if: startsWith(github.ref, 'refs/tags/v') && steps.check_signing.outputs.has_signing == 'true'
        run: ./gradlew assembleRelease --stacktrace
        env:
          RELEASE_KEYSTORE_PATH: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Publish Signed Production Release (GitHub Release)
        if: startsWith(github.ref, 'refs/tags/v') && steps.check_signing.outputs.has_signing == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SecureShield AI ${{ github.ref_name }}
          files: android/app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Publish Distribution Release (GitHub Release)
        if: startsWith(github.ref, 'refs/tags/v') && steps.check_signing.outputs.has_signing != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SecureShield AI ${{ github.ref_name }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Publish Latest APK Release (GitHub Release)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SecureShield AI (Latest APK)
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Distribute to Firebase App Distribution
        if: env.FIREBASE_APP_ID != '' && (env.FIREBASE_TOKEN != '' || env.FIREBASE_SERVICE_CREDENTIALS != '')
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}
          groups: ${{ secrets.FIREBASE_TESTER_GROUPS || 'internal-testers' }}
          file: android/app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: "Automated test build from GitHub Actions commit ${{ github.sha }}"

      - name: Log Firebase Status
        if: env.FIREBASE_APP_ID == ''
        run: |
          echo "ℹ️ Firebase App Distribution secrets not configured. APK successfully generated and stored in GitHub Actions artifacts."



